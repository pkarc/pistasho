[package]
name = "pistasho"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "The hint for the command you need, without leaving the terminal"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pkarc/pistasho"
readme = "README.md"
keywords = ["cli", "shell", "zsh", "tldr", "tmux"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
libc = "0.2"
nucleo-matcher = "0.3"
ratatui = "0.29"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
toml = "0.8"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
