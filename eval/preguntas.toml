# Conjunto de prueba de pistasho.
#
#   pistasho eval eval/preguntas.toml
#
# Cada pregunta lista las herramientas que cuentan como respuesta correcta.
# La meta es llegar a ~100 preguntas, con lo que tú realmente usas.
#
# Nota: el buscador difuso de la fase 1 exige que cada palabra coincida, así que
# con frases completas va a salir bajo. Esa es la línea base contra la que
# mediremos BM25 + embeddings (fase 2) y Laya (fase 3).

