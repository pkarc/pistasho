# pistasho test set.
#
#   pistasho eval eval/questions.toml
#
# Each question lists the tools that count as a correct answer.
# The questions themselves are real Spanish phrasings (that is the point:
# Spanish question vs. English descriptions). The goal is ~100 questions,
# covering what you actually use.
#
# Note: the phase 1 fuzzy searcher requires every word to match, so full
# sentences will score low. That is the baseline against which we will
# measure BM25 + embeddings (phase 2) and Laya (phase 3).

[[q]]
question = "ver qué puertos están escuchando"
tools = ["ss", "netstat", "lsof"]

